<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page metadata -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title -->
  <title>HBnB - Add Review</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Website icon -->
  <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
  <!-- Header with logo, navigation, and login button -->
  <header>
    <div class="header-container">
      <!-- Logo linking to homepage -->
      <a href="index.html">
        <img src="images/logo.png" alt="HBnB logo" class="logo">
      </a>

      <!-- Navigation -->
      <nav>
        <a href="index.html">Home</a>
      </nav>

      <!-- Login button -->
      <a href="login.html" class="login-button" id="login-link">Login</a>
    </div>
  </header>

  <!-- Main content -->
  <main>
    <!-- Review submission form -->
    <section class="form-section">
      <form id="add-review-form" class="form">
        <h1>Add a Review</h1>

        <!-- Display the place ID being reviewed -->
        <p class="place-reference">
          <strong>Place ID:</strong>
          <span id="place-id-display">Loading...</span>
        </p>

        <!-- Review text field -->
        <label for="review">Your Review</label>
        <textarea
          id="review"
          name="review"
          rows="6"
          placeholder="Write your review here"
          required
        ></textarea>

        <!-- Rating dropdown -->
        <label for="rating">Rating</label>
        <select id="rating" name="rating" required>
          <option value="">Select a rating</option>
          <option value="1">1 - Poor</option>
          <option value="2">2 - Fair</option>
          <option value="3">3 - Good</option>
          <option value="4">4 - Very Good</option>
          <option value="5">5 - Excellent</option>
        </select>

        <!-- Message area for success or error feedback -->
        <p id="review-message"></p>

        <!-- Submit button -->
        <button type="submit" class="submit-button">Submit Review</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 HBnB Evolution. All rights reserved.</p>
  </footer>

  <!-- Main JavaScript file -->
  <script src="scripts.js"></script>
</body>
</html>
