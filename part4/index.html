<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Places</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html">
        <img src="images/logo.png" alt="HBnB logo" class="logo">
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="login.html" id="login-link">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Discover Amazing Places to Stay</h1>
      <p>Explore comfortable and unique stays for your next trip.</p>
    </section>

    <section id="filter" class="filter-section">
      <h2>Filter by Price</h2>
      <label for="price-filter">Max Price:</label>
      <select id="price-filter">
        <option value="10">10</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all" selected>All</option>
      </select>
    </section>

    <section id="places-list" class="places-section">
      <h2>Available Places</h2>
    </section>
  </main>

  <footer>
    <p>All rights reserved.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
